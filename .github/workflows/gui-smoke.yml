name: GUI Smoke Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gui-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov numpy pyyaml

      - name: Run cross-platform GUI smoke test
        env:
          APGI_ENFORCE_AUTH: "0"
        run: |
          python -m pytest tests/test_gui_smoke_cross_platform.py -q --no-cov
