description: >
  Autism Spectrum Disorder (ASD) - Inflexible precision allocation.
  High Πₑ for detail, low Πₑ for social cues. Inflexible hierarchy with
  difficulty updating priors. Sensory precision dominates social precision.
  Multi-level rigidity affecting integration across all levels.
