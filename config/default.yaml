data:
  eeg_channels: 32
  max_load_size_mb: 100
  sample_size: 1000
  sampling_rate: 1000
  time_series_length: 100
falsification:
  F1:
    inter_intra_coupling_ratio: 1.5
    pac_baseline_mi_min: 0.012
    pac_coherence_increase_min: 0.2
    pac_delta_theta_baseline_min: 0.008
    pac_ignition_increase_min: 30
  F2:
    cardiac_detection_advantage_min: 0.12
  cohens_d_adaptation_threshold: 0.7
  cohens_d_threshold: 0.6
  cumulative_reward_advantage_threshold: 18
  significance_level: 0.01
  tau_theta_max: 100
  tau_theta_min: 10
  threshold_reduction_min: 20
gui:
  auto_save_interval: 30
  enable_progress_bars: true
  max_threads: 4
  window_height: 800
  window_width: 1200
logging:
  enable_performance_logging: true
  level: INFO
  log_directory: logs/
model:
  F6:
    delta_auroc_min: 0.05
  F6_2_FALSIFICATION_RATIO: 2.5
  F6_2_MIN_CURVE_FIT_R2: 0.85
  F6_2_MIN_INTEGRATION_RATIO: 4.0
  F6_2_WILCOXON_ALPHA: 0.05
  Pi_e: 1.0
  Pi_i_baseline: 1.0
  alpha: 5.0
  beta: 1.2
  beta_Pi_i: 1.0
  dt: 0.05
  duration: 1.0
  gamma_A: 0.05
  gamma_M: 0.1
  hidden_dim: 64
  homeostatic_cost_weight: 0.2
  learning_rate: 0.01
  rho: 0.7
  sigma_S: 0.1
  sigma_noise: 0.8
  sigma_theta: 0.05
  somatic_gain: 1.0
  somatic_hidden_dim: 32
  tau_M: 1.52
  tau_S: 0.5
  tau_theta: 30.0
  theta_0: 0.5
  value_learning_rate: 0.001
network:
  Pi_e_init: 1.0
  Pi_i_init: 1.0
  action_dim: 4
  alpha: 8.0
  batch_size: 32
  beta: 1.2
  context_dim: 8
  context_dim_hier: 8
  dropout: 0.5
  episodic_memory_capacity: 1000
  epochs: 10
  eta_theta: 0.01
  extero_dim: 32
  extero_encoder_layers:
  - 128
  - 64
  - 32
  hidden_dim: 64
  homeostatic_dim: 4
  ignition_cost: 0.1
  intero_dim: 16
  intero_encoder_layers:
  - 64
  - 32
  - 16
  learning_rate: 0.001
  lr_extero: 0.01
  lr_intero: 0.01
  lr_policy: 0.001
  lr_precision: 0.05
  lr_somatic: 0.1
  lr_value: 0.001
  mutation_rate: 0.1
  n_trials_per_model: 100
  objects_dim: 16
  organ_dim: 8
  rho: 0.7
  sensory_dim: 32
  somatic_hidden_dim: 32
  tau_S: 0.3
  tau_context: 1.0
  tau_homeostatic: 2.0
  tau_objects: 0.2
  tau_organ: 0.5
  tau_sensory: 0.05
  tau_theta: 10.0
  tau_visceral: 0.1
  theta_baseline: 0.5
  theta_init: 0.5
  visceral_dim: 16
  working_memory_capacity: 7
  workspace_dim: 4
pac_bands:
  L1_L2:
    amplitude:
    - 30
    - 80
    description: theta-gamma coupling for Level 1-2
    phase:
    - 4
    - 8
  L2_L3:
    amplitude:
    - 4
    - 8
    description: delta-theta coupling for Level 2-3
    phase:
    - 1
    - 4
  L3_L4:
    amplitude:
    - 4
    - 8
    description: delta-theta coupling for Level 3-4
    phase:
    - 1
    - 4
simulation:
  cv_folds: 5
  default_dt: 0.05
  default_steps: 1000
  enable_cross_validation: true
  enable_plots: true
  enable_robustness_tests: true
  enable_sensitivity_analysis: true
  sensitivity_samples: 100
  significance_level: 0.05
validation:
  cv_folds: 5
  enable_cross_validation: true
  enable_robustness_tests: true
  enable_sensitivity_analysis: true
  sensitivity_samples: 100
  significance_level: 0.05
version: 1.3.0
